name: IFC to RDF

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PBS_IFC_SAMPLES_DIR: ${{ github.workspace }}/.cache/ifc-samples
  PBS_REQUIRE_IFC_SAMPLES: "1"

on:
  push:
    branches: ["main"]
    paths:
      - "pragmatic_bim/ifc2rdf/**"
      - "contract/**"
      - "classification/**"
      - "site/schema/pragmatic-bim.shacl.ttl"
      - "tests/ifc2rdf/**"
      - "pyproject.toml"
      - ".github/workflows/ifc2rdf.yml"
  pull_request:
    paths:
      - "pragmatic_bim/ifc2rdf/**"
      - "contract/**"
      - "classification/**"
      - "site/schema/pragmatic-bim.shacl.ttl"
      - "tests/ifc2rdf/**"
      - "pyproject.toml"
      - ".github/workflows/ifc2rdf.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache IFC samples
        uses: actions/cache@v4
        with:
          path: ${{ env.PBS_IFC_SAMPLES_DIR }}
          key: ifc-samples-${{ hashFiles('tests/ifc2rdf/samples.py') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run ifc2rdf tests
        run: pytest tests/ifc2rdf -v
