# German labels for the demo UI (mode "Deutsch"). Mode "Technisch" shows the identifiers.
# Enum values not listed under "values" take their label from the contract (alt_descriptions.de).

ui:
  # Chrome
  check demo: Prüf-Demo
  Labels: Beschriftung
  Check an IFC model: IFC-Modell prüfen
  "The model is converted to the Pragmatic BIM contract graph, checked against the SHACL rules, and opened in a linked graph and 3D view. Everything runs locally.": >-
    Das Modell wird in den Graphen des Pragmatic-BIM-Datenvertrags umgewandelt, mit den SHACL-Regeln
    geprüft und in einer verknüpften Graph- und 3D-Ansicht geöffnet. Alles läuft lokal.
  Upload and check: Hochladen und prüfen
  Previous models: Bisherige Modelle
  Model: Modell
  Uploaded: Hochgeladen
  Status: Status
  processing: Verarbeitung
  Processing failed.: Verarbeitung fehlgeschlagen.
  Back: Zurück
  queued: in Warteschlange
  converting: Umwandlung
  projecting: Projektion
  checking: Prüfung
  done: fertig
  failed: fehlgeschlagen
  Queued: In Warteschlange
  IFC to contract graph and geometry: IFC in Datenvertrags-Graph und Geometrie
  Graph projection: Graph-Projektion
  SHACL checks: SHACL-Prüfungen
  Done: Fertig

  # Workspace
  entities: Objekte
  relations: Beziehungen
  failing: fehlerhaft
  passing: erfüllt
  related: verknüpft
  Export report: Bericht exportieren
  Split: Geteilt
  Clear highlight: Hervorhebung aufheben
  Loading graph…: Graph wird geladen…
  Loading 3D model…: 3D-Modell wird geladen…
  No geometry for this model.: Keine Geometrie für dieses Modell.
  Select a check to highlight its elements in the graph and the 3D model.: >-
    Prüfung wählen, um ihre Elemente im Graphen und im 3D-Modell hervorzuheben.
  Click an element in the graph or the 3D model to see its properties.: >-
    Element im Graphen oder im 3D-Modell anklicken, um seine Eigenschaften zu sehen.
  Could not load: Laden fehlgeschlagen

  # Checks
  Failing: Fehlerhaft
  Passing: Erfüllt
  All: Alle
  violation: Verstoss
  warning: Warnung
  info: Hinweis
  fail: fehlerhaft
  pass: erfüllt
  No checks in this filter.: Keine Prüfungen in diesem Filter.
  Rule: Regel
  "{failed} of {checked} checked elements fail.": "{failed} von {checked} geprüften Elementen fehlerhaft."
  Element: Element
  Finding: Befund
  Findings: Befunde
  "Showing {shown} of {total} findings. The report lists all.": "{shown} von {total} Befunden angezeigt. Der Bericht listet alle."

  # Element
  This IFC object is not part of the contract graph (excluded or not mapped).: >-
    Dieses IFC-Objekt ist nicht Teil des Datenvertrags-Graphen (ausgeschlossen oder nicht abgebildet).
  Attributes: Attribute
  Relations: Beziehungen
  this element → related: dieses Element → verknüpftes
  related → this element: verknüpftes → dieses Element

  # Report
  Check report: Prüfbericht
  checked: geprüft
  Summary: Zusammenfassung
  Source system: Quellsystem
  Entities in the graph: Objekte im Graphen
  Checks: Prüfungen
  Check: Prüfung
  Severity: Schweregrad
  Checked: Geprüft
  Class: Klasse
  No findings.: Keine Befunde.
  Conversion: Umwandlung

