# PropertySet fallback lists (default + Revit / ArchiCAD / Vectorworks).
pset_fallbacks:
  code_or_number_default_items: &code_default_items
    - pset: Pset_BuildingElementCommon
      property: Reference
    - pset: Pset_ManufacturerTypeInformation
      property: ModelReference
    - pset: Pset_ElementCommon
      property: Tag

  code_or_number_revit: &code_revit
    - pset: Pset_Revit_IdentityData
      property: Mark
    - pset: Pset_Revit_TypeIdentity
      property: Type Mark
    - pset: Pset_Revit_IdentityData
      property: Type Name

  code_or_number_archicad: &code_archicad
    - pset: ARCHICAD_General
      property: ID
    - pset: ARCHICAD_General
      property: Element ID
    - pset: Pset_ManufacturerTypeInformation
      property: ModelReference

  code_or_number_vectorworks: &code_vectorworks
    - pset: Vectorworks_General
      property: Tag
    - pset: Vectorworks_Data
      property: RecordName
    - pset: Pset_ManufacturerTypeInformation
      property: ModelReference

  code_or_number_wall: &code_wall
    fallbacks:
      - pset: Pset_WallCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_slab: &code_slab
    fallbacks:
      - pset: Pset_SlabCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_door: &code_door
    fallbacks:
      - pset: Pset_DoorCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_window: &code_window
    fallbacks:
      - pset: Pset_WindowCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_space: &code_space
    fallbacks:
      - pset: Pset_SpaceCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_duct: &code_duct
    fallbacks:
      - pset: Pset_DuctSegmentCommon
        property: Reference
      - pset: Pset_DuctFittingCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_pipe: &code_pipe
    fallbacks:
      - pset: Pset_PipeSegmentCommon
        property: Reference
      - pset: Pset_PipeFittingCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_equipment: &code_equipment
    fallbacks:
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  code_or_number_covering: &code_covering
    fallbacks:
      - pset: Pset_CoveringCommon
        property: Reference
      - pset: Pset_BuildingElementCommon
        property: Reference
      - pset: Pset_ManufacturerTypeInformation
        property: ModelReference
      - pset: Pset_ElementCommon
        property: Tag
    source_system_overrides:
      revit: *code_revit
      archicad: *code_archicad
      vectorworks: *code_vectorworks

  # --- Performance properties (attributes.performance_properties) ---
  # One list per property covers every mapped building element: an instance carries only
  # the Pset_*Common of its own class. Tool-specific entries are source_system_fallbacks,
  # tried AFTER the standard psets: exporters copy the same tool parameter into
  # Pset_*Common, and the Revit sample shows tool psets disagreeing with it
  # (PSet_Revit_Structural.Structural = false where Pset_SlabCommon.LoadBearing = true).
  # Vectorworks maps ratings into Pset_*Common through the Data Manager; custom psets are
  # project-specific and go in the vectorworks list when needed.

  perf_fire_rating: &perf_fire_rating
    fallbacks:
      - {pset: Pset_WallCommon, property: FireRating}
      - {pset: Pset_CurtainWallCommon, property: FireRating}
      - {pset: Pset_SlabCommon, property: FireRating}
      - {pset: Pset_RoofCommon, property: FireRating}
      - {pset: Pset_CoveringCommon, property: FireRating}
      - {pset: Pset_DoorCommon, property: FireRating}
      - {pset: Pset_WindowCommon, property: FireRating}
      - {pset: Pset_ColumnCommon, property: FireRating}
      - {pset: Pset_BeamCommon, property: FireRating}
      - {pset: Pset_StairCommon, property: FireRating}
      - {pset: Pset_RampCommon, property: FireRating}
    source_system_fallbacks:
      revit:
        - {pset: PSet_Revit_Type_Identity Data, property: Fire Rating}
        - {pset: PSet_Revit_Type_Other, property: FireRating}
        - {pset: PSet_Revit_Other, property: FireRating}
      archicad:
        - {pset: General Ratings, property: Fire Resistance Rating}
      vectorworks: []

  perf_acoustic_rating: &perf_acoustic_rating
    fallbacks:
      - {pset: Pset_WallCommon, property: AcousticRating}
      - {pset: Pset_CurtainWallCommon, property: AcousticRating}
      - {pset: Pset_SlabCommon, property: AcousticRating}
      - {pset: Pset_RoofCommon, property: AcousticRating}
      - {pset: Pset_CoveringCommon, property: AcousticRating}
      - {pset: Pset_DoorCommon, property: AcousticRating}
      - {pset: Pset_WindowCommon, property: AcousticRating}
    source_system_fallbacks:
      revit:
        - {pset: PSet_Revit_Type_Other, property: AcousticRating}
        - {pset: PSet_Revit_Other, property: AcousticRating}
      archicad:
        - {pset: General Ratings, property: Acoustic Rating}
      vectorworks: []

  perf_thermal_transmittance: &perf_thermal_transmittance
    fallbacks:
      - {pset: Pset_WallCommon, property: ThermalTransmittance}
      - {pset: Pset_CurtainWallCommon, property: ThermalTransmittance}
      - {pset: Pset_SlabCommon, property: ThermalTransmittance}
      - {pset: Pset_RoofCommon, property: ThermalTransmittance}
      - {pset: Pset_CoveringCommon, property: ThermalTransmittance}
      - {pset: Pset_DoorCommon, property: ThermalTransmittance}
      - {pset: Pset_WindowCommon, property: ThermalTransmittance}
      - {pset: Pset_ColumnCommon, property: ThermalTransmittance}
      - {pset: Pset_BeamCommon, property: ThermalTransmittance}
    source_system_fallbacks:
      revit:
        - {pset: PSet_Revit_Type_Analytical Properties, property: Heat Transfer Coefficient (U)}
      archicad:
        - {pset: General Ratings, property: Thermal Transmittance}
      vectorworks: []

  perf_is_external: &perf_is_external
    fallbacks:
      - {pset: Pset_WallCommon, property: IsExternal}
      - {pset: Pset_CurtainWallCommon, property: IsExternal}
      - {pset: Pset_SlabCommon, property: IsExternal}
      - {pset: Pset_RoofCommon, property: IsExternal}
      - {pset: Pset_CoveringCommon, property: IsExternal}
      - {pset: Pset_DoorCommon, property: IsExternal}
      - {pset: Pset_WindowCommon, property: IsExternal}
      - {pset: Pset_ColumnCommon, property: IsExternal}
      - {pset: Pset_BeamCommon, property: IsExternal}
      - {pset: Pset_StairCommon, property: IsExternal}
      - {pset: Pset_RampCommon, property: IsExternal}
    # Revit (Function) and ArchiCAD (Position) write IsExternal into Pset_*Common.
    source_system_fallbacks:
      revit: []
      archicad: []
      vectorworks: []

  perf_load_bearing: &perf_load_bearing
    fallbacks:
      - {pset: Pset_WallCommon, property: LoadBearing}
      - {pset: Pset_SlabCommon, property: LoadBearing}
      - {pset: Pset_ColumnCommon, property: LoadBearing}
      - {pset: Pset_BeamCommon, property: LoadBearing}
    # ArchiCAD writes Structural Function into Pset_*Common.LoadBearing.
    source_system_fallbacks:
      revit:
        - {pset: PSet_Revit_Structural, property: Structural}
      archicad: []
      vectorworks: []
