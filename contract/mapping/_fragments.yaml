# Shared field, geometry, and attribute fragments.
fragments:
  physical_containment_relations: &physical_containment_relations
    - IfcRelContainedInSpatialStructure
    - IfcRelSpaceBoundary

  context_aggregation_relations: &context_aggregation_relations
    - IfcRelAggregates

  geometry_body_footprint: &geometry_body_footprint
    primary: body_3d
    secondary: footprint_2d

  geometry_axis_body: &geometry_axis_body
    primary: axis
    secondary: body_3d

  geometry_footprint_body: &geometry_footprint_body
    primary: footprint_2d
    secondary: body_3d

  geometry_axis_only: &geometry_axis_only
    primary: axis

  fields_physical_base: &fields_physical_base
    name: *name_fallback_chain
    code_or_number:
      source: ifc_pset_fallback
      fallbacks: *code_default_items
      source_system_overrides:
        revit: *code_revit
        archicad: *code_archicad
        vectorworks: *code_vectorworks
    storey: *storey_from_containment
    classifications: *classifications_mapping

  # Rule-relevant PropertySet values promoted to typed PerformanceProperty records
  # (Entity.performance_properties). Each record carries source_pset, source_property,
  # source_value_raw, and mapping_version; the raw value also stays in metadata[].
  performance_properties_building_element: &performance_properties_building_element
    source: ifc_pset_performance
    properties:
      - property_class: FireProperty
        property_key: resistance_rating
        lookup:
          source: ifc_pset_fallback
          <<: *perf_fire_rating
        normalize: *normalize_fire_rating
      - property_class: AcousticProperty
        property_key: rating_db
        lookup:
          source: ifc_pset_fallback
          <<: *perf_acoustic_rating
        normalize: *normalize_acoustic_rating_db
      - property_class: ThermalProperty
        property_key: thermal_transmittance
        lookup:
          source: ifc_pset_fallback
          <<: *perf_thermal_transmittance
        normalize: *normalize_thermal_transmittance
      - property_class: ThermalProperty
        property_key: is_external
        lookup:
          source: ifc_pset_fallback
          <<: *perf_is_external
        normalize: *normalize_boolean
      - property_class: StructuralProperty
        property_key: load_bearing
        lookup:
          source: ifc_pset_fallback
          <<: *perf_load_bearing
        normalize: *normalize_boolean

  attributes_entity_base: &attributes_entity_base
    ifc_global_id:
      source: ifc_attribute
      attribute: GlobalId
    description:
      source: ifc_attribute
      attribute: Description
    metadata: *metadata_captured
