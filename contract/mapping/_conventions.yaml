# Global conventions and reusable field anchors.
conventions:
  fallback_policy: first_match_wins
  # IFC GlobalId is the stable link between IFC source records and PBS contract rows.
  ifc_contract_link:
    description: >
      IFC GlobalId (22-char GUID) is the primary crosswalk identifier. The adapter uses
      the same value for content.source_id, attributes.ifc_global_id (Entity.ifc_global_id),
      and content_relations source/target keys. Re-imports and diffs match on GlobalId.
    ifc_attribute: GlobalId
    contract_slots:
      - content.source_id
      - attributes.ifc_global_id
    relations_columns:
      - content_relations.source_content_id
      - content_relations.target_content_id
  source_id:
    source: ifc_attribute
    attribute: GlobalId
  source_system:
    default: ifc
    # Case-insensitive keywords matched against IfcApplication (ApplicationFullName,
    # ApplicationIdentifier) and the STEP header originating_system / preprocessor_version.
    detect:
      revit: [revit]
      archicad: [archicad, graphisoft]
      vectorworks: [vectorworks]
  # Projection of this mapping onto the contract's RDF vocabulary (ifc2rdf).
  rdf_projection:
    description: >
      fields.* are adapter columns. Only fields listed under field_slots become contract
      slots in RDF. Fields without a contract slot (code_or_number) are not emitted, so the
      PropertySet values they read stay in metadata[]. Entities listed under
      exclude_entities are not emitted because the contract requires a slot that the
      mapping cannot fill from IFC.
    field_slots:
      name: name
      storey: parent_level
      classifications: classifications
    exclude_entities:
      IfcOpeningElement: >
        connection_functional_types is required on ConnectionPhysical but has no IFC
        default for openings (assigned per case).
  name_fallback_chain: &name_fallback_chain
    source: ifc_attribute_fallback
    fallbacks:
      - attribute: Name
      - attribute: LongName
      - attribute: ObjectType
      # Entity.name is required; unnamed instances (for example IfcBuilding in some
      # Revit exports) fall back to their GlobalId.
      - attribute: GlobalId
  classifications_mapping: &classifications_mapping
    source: ifc_classification
    via_relation: IfcRelAssociatesClassification
    map:
      classification_scheme:
        source: ifc_attribute_fallback
        fallbacks:
          - attribute: ReferencedSource.Name
          - constant: ifc
      classification_code:
        source: ifc_attribute_fallback
        fallbacks:
          - attribute: Identification
          - attribute: ItemReference
      classification_label:
        source: ifc_attribute
        attribute: Name
      classification_uri:
        source: ifc_attribute
        attribute: Location
      classification_source:
        source: ifc_attribute
        attribute: ReferencedSource.SourceRoles
  storey_from_containment: &storey_from_containment
    source: ifc_relation
    relation: IfcRelContainedInSpatialStructure
    direction: related
    resolve:
      walk_up_to_class: IfcBuildingStorey
      output: GlobalId
  metadata_unmapped_ifc_attributes: &metadata_unmapped_ifc_attributes
    source: ifc_attribute_all
    description: >
      All IFC entity attributes not promoted to fields or typed attribute slots are
      preserved in metadata for traceability and downstream use.
    exclude_attributes:
      - GlobalId
      - Name
      - LongName
      - ObjectType
      - Description
    exclude_when_promoted_to:
      - fields.name
      - fields.code_or_number
      - fields.storey
      - attributes.description
      - attributes.ifc_global_id
    exclude_when_mapped_to_typed_slot: true
    map_to: metadata
    entry_format:
      metadata_key: "{ifc_class}.{attribute}"
      metadata_value: "{value_serialized}"

  metadata_unmapped_psets: &metadata_unmapped_psets
    source: ifc_pset_all
    exclude_used_in: [code_or_number, attributes]
    # performance_properties normalizes the value; the raw value stays in metadata.
    keep_used_in: [attributes.performance_properties]
    map_to: metadata
    entry_format:
      metadata_key: "{pset}.{property}"
      metadata_value: "{value_serialized}"

  metadata_captured: &metadata_captured
    source: metadata_merge
    description: >
      Combined metadata from IFC entity attributes and PropertySets. Both are stored
      in the PBS metadata[] slot (MetadataEntry) on the contract entity.
    parts:
      - *metadata_unmapped_ifc_attributes
      - *metadata_unmapped_psets

  space_name_type_lookup: &space_name_type_lookup
    source: vocabulary_lookup
    description: >
      Resolve Pset_SpaceCommon.Reference (armasuisse Raumliste) or name labels to
      SpaceNameType enum values using mapping bridges and vocabulary prefLabels.
    tables:
      - match:
          source: ifc_pset_fallback
          fallbacks:
            - pset: Pset_SpaceCommon
              property: Reference
        bridge: armasuisse-room-name-to-abstract-room-name
      - match:
          source: ifc_attribute_fallback
          fallbacks:
            - attribute: LongName
            - attribute: Name
        vocabulary: building-space-name-classification
        match_property: prefLabel
    default: null

  space_activity_from_name_type: &space_activity_from_name_type
    source: vocabulary_derived_classification
    description: >
      When space_name_type is set, append a BuildingSpaceActivityClassification entry
      unless that scheme is already present on classifications[].
    from_attribute: space_name_type
    bridge: abstract-room-name-to-space-activity
    classification_scheme: BuildingSpaceActivityClassification
    classification_source: derived-from-space-name-type
    append_if_scheme_missing: true

  space_is_heated: &space_is_heated
    source: ifc_pset_fallback
    fallbacks:
      - pset: Pset_SpaceCommon
        property: IsHeated

  space_is_cooled: &space_is_cooled
    source: ifc_pset_fallback
    fallbacks:
      - pset: Pset_SpaceCommon
        property: IsAirConditioned

  space_above_ground_from_level: &space_above_ground_from_level
    source: attribute_derivation
    description: >
      When is_above_ground is unset on Space, derive from parent_level.elevation
      (IfcBuildingStorey.Elevation): elevation >= 0 means above ground, elevation < 0
      means below ground. An explicit is_above_ground value on Space takes precedence.
    target_attribute: is_above_ground
    when_target_unset: true
    from_relation: parent_level
    from_attribute: elevation
    rule:
      operator: gte
      threshold: 0

  # Value normalization for performance_properties. A candidate value that is rejected
  # (accept_pattern / accept_range / boolean lists) is skipped and the next lookup entry is
  # tried; the raw value always stays in metadata[].
  normalize_fire_rating: &normalize_fire_rating
    value_type: string
    remove_whitespace: true
    upper_case: true
    # "EI 90-RF1" → resistance_rating EI90 + reaction_to_fire RF1. Suffixes without a
    # route (for example -C self-closing, -M mechanical) are dropped from the normalized
    # value and remain in source_value_raw.
    suffix_separator: "-"
    suffix_routes:
      - pattern: "^RF[1-4](CR|\\(CR\\))?$"
        property_key: reaction_to_fire
      - pattern: "^S(A|M|200)$"
        property_key: smoke_rating
    # EN 13501-2 (EI90, REI60, E30) and DIN 4102 (F90, T30) classes; labels such as
    # "Fire Rating" (Revit placeholder) are rejected.
    accept_pattern: "^[A-Z]{1,4}[0-9]{2,4}$"

  normalize_acoustic_rating_db: &normalize_acoustic_rating_db
    value_type: number
    # First number in the label: "Rw 52 dB", "R'w = 45 (-1;-3)" → 52, 45. Comma decimals accepted.
    number_pattern: "[0-9]+(?:[.,][0-9]+)?"
    accept_range: {gte: 10, lte: 100}
    unit: dB
    unit_uri: http://qudt.org/vocab/unit/DeciB

  normalize_thermal_transmittance: &normalize_thermal_transmittance
    value_type: number
    # IfcThermalTransmittanceMeasure in the project unit (IFC default W/(m²·K)).
    number_pattern: "[0-9]+(?:[.,][0-9]+)?"
    accept_range: {gt: 0, lte: 10}
    unit: W/m2K
    unit_uri: http://qudt.org/vocab/unit/W-PER-M2-K

  normalize_boolean: &normalize_boolean
    value_type: boolean
    # IfcBoolean / IfcLogical; UNKNOWN and free text are rejected.
    true_values: ["true", ".t.", "yes"]
    false_values: ["false", ".f.", "no"]

