id: https://schema.pragmaticbim.ch/entity/measurement
name: pragmatic_bim_entity_measurement_schema
title: Pragmatic BIM Data Contract - Entity Measurement
description: 'Derived measurement entities that give multi-subject quantities their own identity.

  '
license: MIT
see_also:
- https://schema.pragmaticbim.ch/entity/measurement
- https://schema.pragmaticbim.ch/schema/pragmatic-bim.docs.html
prefixes:
  linkml: https://w3id.org/linkml/
  pbs: https://schema.pragmaticbim.ch/
  ifc: https://standards.buildingsmart.org/IFC/DEV/IFC4_3/FINAL/HTML/
  ifcowl: https://w3id.org/ifc/IFC4_ADD2#
  bot: https://w3id.org/bot#
default_prefix: pbs
default_range: string
imports:
- linkml:types
- entity_core_schema
- entity_schema_enums
classes:
  DerivedMeasurement:
    is_a: Entity
    class_uri: pbs:DerivedMeasurement
    description: >-
      Measurement entity with its own identity for values that involve more than one subject
      (for example clear width between a stair and two railings). Subjects are listed in
      applies_to_entities; the value and its Derivation live in quantity_values; an optional
      display line uses geometry_representations (typically WKT LINESTRING Z). Use measurement_status
      to distinguish a successful measure from not_measurable or not_applicable.
    slots:
    - measurement_status
    slot_usage:
      content_kind:
        equals_string: measurement
      measurement_status:
        required: true
        ifabsent: measured
slots:
  measurement_status:
    range: MeasurementStatus
    required: true
    description: >-
      Whether the measurement was obtained (measured), could not be computed from the model
      (not_measurable), or does not apply in this context (not_applicable).
